<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Student Randomiser</title>
  </head>

  <body style="margin:0; padding:0; overflow:auto;">

    <canvas
      id="unity-canvas"
      width="1366"
      height="598"
      tabindex="-1"
      style="display:block; width:1366px; height:598px; background:#231F20;">
    </canvas>

    <script src="Build/student-randomiser-web.loader.js"></script>

    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      const canvas = document.querySelector("#unity-canvas");

      canvas.style.display = "block";
      canvas.style.margin = "0";
      canvas.style.width = "1366px";
      canvas.style.height = "598px";

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/student-randomiser-web.data",
        frameworkUrl: "Build/student-randomiser-web.framework.js",
        codeUrl: "Build/student-randomiser-web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hokuryo JHS",
        productName: "Student Randomiser",
        productVersion: "v0.1",

        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      }).then((unityInstance) => {

      }).catch((message) => {
        alert(message);
      });
    </script>

  </body>
</html>

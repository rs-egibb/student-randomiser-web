<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>Unity Web Player | Student Randomiser</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      overflow: auto;
      direction: rtl;
      background: #231F20;
    "
  >
    <div
      style="
        width: 1366px;
        height: 598px;
        margin-left: auto;
        margin-right: 0;
        direction: ltr;
      "
    >
      <canvas
        id="unity-canvas"
        width="1366"
        height="598"
        tabindex="-1"
        style="
          display: block;
          width: 1366px;
          height: 598px;
          background: #231F20;
        "
      ></canvas>
    </div>

    <script src="Build/student-randomiser-web.loader.js"></script>

    <script>
      const canvas = document.querySelector("#unity-canvas");

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/student-randomiser-web.data",
        frameworkUrl: "Build/student-randomiser-web.framework.js",
        codeUrl: "Build/student-randomiser-web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hokuryo JHS",
        productName: "Student Randomiser",
        productVersion: "v0.1",

        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      }).then((unityInstance) => {

      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>

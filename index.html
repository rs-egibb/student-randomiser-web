<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"
    >
    <title>Student Randomiser</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        background: #231f20;
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 598px;
        margin: 0;
        padding: 0;
        border: 0;
        background: #231f20;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <canvas
      id="unity-canvas"
      width="1366"
      height="598"
      tabindex="-1"
    ></canvas>

    <script src="Build/student-randomiser-web.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");

      /*
       * ChromeOS 90% display size reports a logical screen width
       * of approximately 1518px instead of the native 1366px.
       *
       * A CSS height of 598px therefore occupies only about
       * 538 physical pixels at 90%, cutting off the lower UI.
       *
       * Increase the displayed canvas height to approximately
       * 665px only at this display setting.
       *
       * The normal 100% layout remains exactly 598px high.
       */
      if (window.screen.width >= 1450) {
        canvas.style.height = "665px";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/student-randomiser-web.data",
        frameworkUrl: "Build/student-randomiser-web.framework.js",
        codeUrl: "Build/student-randomiser-web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Hokuryo JHS",
        productName: "Student Randomiser",
        productVersion: "v0.1",
        // devicePixelRatio: 1,
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
